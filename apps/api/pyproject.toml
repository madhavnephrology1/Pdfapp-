[project]
name = "pdf-human-reader-api"
version = "0.1.0"
description = "Server-side speech and text-recognition for the PDF Human Reader."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
]

# Declared explicitly: setuptools' flat-layout auto-discovery otherwise picks up
# the runtime `tmp/` directory the API creates for temporary files and refuses
# to build.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert: used throughout the test suite
  "B008",  # Depends(...) in a default IS the FastAPI dependency idiom
]

[tool.ruff.lint.per-file-ignores]
# 0.0.0.0 is the intended default so the API is reachable from a container.
"app/core/config.py" = ["S104"]
# The tests parse SSML this application generated itself, not untrusted input.
"tests/*" = ["S105", "S106", "S314"]
