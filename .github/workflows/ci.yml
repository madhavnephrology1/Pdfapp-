name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          # Playwright's browser is installed separately in the e2e job.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Tests
        run: python -m pytest -q

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - run: pip install -e ".[dev]"
        working-directory: apps/api

      - name: Start the API
        working-directory: apps/api
        # The mock speech provider needs no credentials and returns real word
        # timings, so the whole playback path is exercised without a vendor.
        env:
          TTS_PROVIDER: mock
          OCR_PROVIDER: mock
          WEB_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Build the web app
        run: npm run build

      - name: Start the web app
        working-directory: apps/web
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done

      - name: End-to-end tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
