services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      # Inside the compose network the browser still reaches the API on the
      # host, so the allowed origin stays a localhost URL.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      TEMP_FILE_DIRECTORY: /app/tmp
    ports:
      - '8000:8000'
    tmpfs:
      # Temporary files live in RAM and never touch a persistent volume.
      - /app/tmp:mode=0700,uid=10001,gid=10001
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${NEXT_PUBLIC_MAX_UPLOAD_MB:-100}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# No database and no volumes: nothing derived from a user's document is
# persisted server-side. Reading positions live in the browser's IndexedDB.
